[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collector"
version = "0.1.0"
description = "IoT data collector — ingests readings, stores them, evaluates alerts, and serves a REST API"
requires-python = ">=3.11"
dependencies = [
    "iot-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
collector = "collector.app:main"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
