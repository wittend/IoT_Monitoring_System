[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensor-agent"
version = "0.1.0"
description = "IoT sensor agent that simulates sensors and ships readings to the collector"
requires-python = ">=3.11"
dependencies = [
    "iot-shared",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
sensor-agent = "sensor_agent.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["sensor_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
