[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iot-shared"
version = "0.1.0"
description = "Shared data models and utilities for the IoT Monitoring System"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["iot_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
